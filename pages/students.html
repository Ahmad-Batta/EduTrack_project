<section id="add-student-form" hidden>

    <h2>Add Student</h2>

    <input
        type="text"
        id="first-name-input"
        placeholder="First Name"
    >

    <input
        type="text"
        id="last-name-input"
        placeholder="Last Name"
    >

    <input
        type="text"
        id="university-id-input"
        placeholder="Student ID"
    >

    <input
        type="email"
        id="email-input"
        placeholder="Email"
    >

    <select id="gender-input">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>


    <select id="status-input">
    <option value="active">Active</option>
    <option value="archived">Archived</option>
</select>

    <input
        type="text"
        id="major-input"
        placeholder="Major"
    >

    <input
        type="text"
        id="university-input"
        placeholder="University"
    >

    <input
        type="text"
        id="instructor-id-input"
        placeholder="Instructor ID"
    >

    <!-- <label for="student-image-input">
        Student Image
    </label>

    <input
        type="file"
        id="student-image-input"
        accept="image/*"
    > -->

    <button id="save-student-btn">
        Save Student
    </button>

</section>




        <section class="students-tools">

            <input
                type="text"
                id="search-input"
                placeholder="Search by name or student ID"
            >

            <select id="filter-select">
                <option value="all">All Students</option>
                <option value="active">Active</option>
                <option value="archived">Archived</option>
            </select>

        </section>


        <section
            id="students-container"
            class="students-container">
        </section>


        <p id="no-students-message" hidden>
            No students found.
        </p>


        <template id="student-card-template">

            <article class="student-card">

                <h2 class="student-name">
                    Student Name
                </h2>

                <p>
                    <strong>Student ID:</strong>
                    <span class="student-id"></span>
                </p>

                <p>
                    <strong>Major:</strong>
                    <span class="student-major"></span>
                </p>

                <p>
                    <strong>University:</strong>
                    <span class="student-university"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span class="student-email"></span>
                </p>


                <div class="student-actions">

                    <button class="view-profile-btn">
                        View Profile
                    </button>

                </div>

            </article>

        </template>

    </main>


    <script
        type="module"
        src="../js/students.js">
    </script>

</body>

</html>
