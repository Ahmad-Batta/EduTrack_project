<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - EduTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/contactUs.css">
    </head>
<body>

    <!-- الهيدر العلوي -->
    <header>
        <a href="../index.html" class="logo">EduTrack</a>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="aboutUs.html">About Us</a>
            <a href="contactUs.html" class="active">Contact Us</a>
        </div>
    </header>

    <main class="main-content">
    <div class="contact-container">
        <h1>Get in Touch</h1>
        <p>Have questions or need support? Drop us a message below.</p>
        
        <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent successfully.');">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </div>
</main>
    <!-- الفوتر -->
    <footer>
        <p>&copy; 2026 EduTrack. All rights reserved.</p>
    </footer>

</body>
</html>
